}

.logo h2{

margin:0;
}

nav ul{
display:flex;
list-style:none;
margin:0;
padding:0;
}

nav ul li{
margin-left:20px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

nav ul li a:hover{

}

.hero{

background:
linear-gradient(rgba(35,43,139,.75),rgba(35,43,139,.75)),
url("images/event.jpg");

background-size:cover;
background-position:center;

padding:120px 20px;

text-align:center;

.hero h1{

font-size:50px;

margin-bottom:20px;

}

.hero p{

}

.container{

width:90%;

max-width:900px;

margin:50px auto;

background:white;

padding:40px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}

}

textarea{

width:100%;

padding:15px;

margin:12px 0;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

box-sizing:border-box;

}

height:140px;

}

button{

width:100%;

padding:16px;

background:#E91E63;

color:white;

font-size:18px;

border:none;

border-radius:8px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0A2E5C;

transform:scale(1.03);

}

footer{

background:#0A2E5C;

color:white;

text-align:center;

<section class="hero">

<h1>Become a Volunteer</h1>

<p>Together we can make a lasting difference in our communities.</p>

</section>

<div class="container">

<h2>Volunteer Application Form</h2>

<form id="volunteerForm">

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="text"
id="phone"
placeholder="Phone Number">

<input
type="text"
id="occupation"
placeholder="Occupation">

<textarea
id="motivation"
placeholder="Why do you want to volunteer?"></textarea>

<button type="submit">

Submit Application

</button>

</form>

</div>

<footer>

<p>&copy; 2026 Great Time Victims. All Rights Reserved.</p>

</footer>

<script>

document
.getElementById("volunteerForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        /* ==========================================
                GET FORM VALUES
        =========================================== */

        const fullName =
            document
            .getElementById("fullName")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const occupation =
            document
            .getElementById("occupation")
            .value
            .trim();


        const motivation =
            document
            .getElementById("motivation")
            .value
            .trim();


        /* ==========================================
                CREATE VOLUNTEER APPLICATION
        =========================================== */

        const volunteer = {

            id: Date.now(),

            fullName: fullName,

            email: email,

            phone: phone,

            occupation: occupation,

            motivation: motivation,

            date: new Date().toLocaleString()

        };


        /* ==========================================
                GET EXISTING APPLICATIONS
        =========================================== */

        const volunteers =
            JSON.parse(
                localStorage.getItem("gtvVolunteers")
            ) || [];


        /* ==========================================
                SAVE APPLICATION
        =========================================== */

        volunteers.unshift(volunteer);


        localStorage.setItem(
            "gtvVolunteers",
            JSON.stringify(volunteers)
        );


        /* ==========================================
                SUCCESS
        =========================================== */

        alert(
            "Thank you! Your volunteer application has been submitted."
        );


        document
        .getElementById("volunteerForm")
        .reset();

    }
);

</script>
<script src="js/script.js"></script>
